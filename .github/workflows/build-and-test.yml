name: Build and Test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build solver-xray
      working-directory: xray
      run: make

    - name: Run tests
      working-directory: xray
      run: make test

  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build solver-xray
      working-directory: xray
      run: make

    - name: Run tests
      working-directory: xray
      run: make test
